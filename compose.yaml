services:
  db:
    image: pgvector/pgvector:pg16
    container_name: supportflow-db
    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - supportflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U supportflow -d supportflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  supportflow_pgdata: